<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Paint the saved theme before the app loads, so there's no flash of the wrong colours
      (function () {
        try {
          var snap = JSON.parse(localStorage.getItem("tt-appearance-snapshot") || "null");
          var root = document.documentElement;
          if (!snap) {
            if (localStorage.getItem("theme") === "dark" || (!localStorage.getItem("theme") && matchMedia("(prefers-color-scheme: dark)").matches)) root.classList.add("dark");
            return;
          }
          if (snap.dark) root.classList.add("dark");
          if (snap.reduceMotion) root.classList.add("reduce-motion");
          root.style.colorScheme = snap.dark ? "dark" : "light";
          for (var name in snap.vars) root.style.setProperty(name, snap.vars[name]);
          root.style.fontSize = snap.fontSize + "px";
          if (snap.fontHref) {
            var link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = snap.fontHref;
            document.head.appendChild(link);
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Team Task</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
